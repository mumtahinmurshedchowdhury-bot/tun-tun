<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday, Tanu 🎂</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 90%22><path d=%22M50 85 C10 55 0 30 20 14 C34 3 48 10 50 24 C52 10 66 3 80 14 C100 30 90 55 50 85 Z%22 fill=%22%23FF8FAE%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B0E2A;
    --plum:#2A1B4D;
    --gold:#FFD27D;
    --rose:#FF8FAE;
    --lilac:#C9A7EB;
    --cream:#FDF6EC;
    --bark:#8A5A3B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    background: radial-gradient(ellipse at 50% 15%, var(--plum) 0%, var(--navy) 60%, #05061a 100%);
    font-family:'Quicksand',sans-serif;
    color:var(--cream);
  }
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
  .star{
    position:absolute;border-radius:50%;background:var(--cream);
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:.9;}}

  #moon{
    position:fixed;top:6%;right:8%;z-index:0;pointer-events:none;
    width:64px;height:64px;
    filter:drop-shadow(0 0 24px rgba(255,230,180,.35));
    opacity:.9;
  }

  #ambient{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
  .drift{
    position:absolute;bottom:-30px;opacity:0;
    animation:driftUp linear infinite;
  }
  @keyframes driftUp{
    0%{opacity:0;transform:translateY(0) rotate(0deg);}
    8%{opacity:.55;}
    92%{opacity:.4;}
    100%{opacity:0;transform:translateY(-115vh) rotate(60deg);}
  }

  .petal-fall{
    position:fixed;top:0;pointer-events:none;z-index:3;
    animation:petalDown linear forwards;
  }
  @keyframes petalDown{
    0%{opacity:0;transform:translateY(0) rotate(0deg);}
    8%{opacity:1;}
    100%{opacity:.85;transform:translateY(90vh) rotate(340deg);}
  }

  #stage{
    position:relative;z-index:2;width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    padding:24px;text-align:center;
  }

  .eyebrow{
    letter-spacing:.35em;text-transform:uppercase;font-size:11px;color:var(--lilac);
    font-weight:600;
  }
  .prompt-title{
    font-family:'Fraunces',serif;font-weight:600;font-style:italic;
    font-size:clamp(24px,6vw,40px);color:var(--cream);margin:6px 0 4px;
    text-shadow:0 0 30px rgba(255,210,125,.25);
  }
  .prompt-sub{font-size:14px;color:rgba(253,246,236,.65);max-width:320px;margin:0 0 18px;}
  .tap-hint{
    font-size:12px;color:var(--gold);opacity:.85;margin-top:14px;
    animation:pulseHint 1.8s ease-in-out infinite;
  }
  @keyframes pulseHint{0%,100%{opacity:.35;}50%{opacity:1;}}

  /* ---------- Scene 1: shoot ---------- */
  #shoot-scene{
    display:flex;flex-direction:column;align-items:center;
    transition:opacity .5s ease, transform .5s ease;
  }
  #shoot-scene.hidden{opacity:0;transform:scale(.92);pointer-events:none;position:absolute;}

  #target-area{
    position:relative;width:min(90vw,360px);height:220px;
    cursor:pointer;
  }
  #heart{
    position:absolute;left:50%;top:50%;
    width:76px;height:68px;
    transform:translate(-50%,-50%);
    filter:drop-shadow(0 0 18px rgba(255,143,174,.55));
    animation:heartbeat 1.4s ease-in-out infinite;
    transition:opacity .25s ease, transform .25s ease;
  }
  @keyframes heartbeat{
    0%,100%{transform:translate(-50%,-50%) scale(1);}
    50%{transform:translate(-50%,-50%) scale(1.08);}
  }
  #heart.popped{opacity:0;transform:translate(-50%,-50%) scale(1.6);}

  #bow{
    position:absolute;left:0;top:50%;
    width:38px;height:130px;
    transform:translateY(-50%);
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));
    z-index:1;
  }
  #bowstring{
    transition:transform .35s ease;
    transform-origin:12px 80px;
  }
  #target-area.pulling #bowstring{
    transform:translateX(14px);
  }

  #arrow{
    position:absolute;
    left:14px; top:50%;
    width:70px;height:16px;
    transform:translate(0,-50%) rotate(0deg);
    transition:transform 1.1s cubic-bezier(.2,.7,.2,1), opacity .3s ease .9s;
    transform-origin:left center;
    z-index:2;
  }
  #arrow.fired{
    transform:translate(calc(min(90vw,360px) - 108px), -2px) rotate(-2deg) scale(1.02);
  }
  #arrow.done{opacity:0;}

  .bow-hint-line{
    position:absolute;left:0;top:50%;width:100%;height:1px;
    background:repeating-linear-gradient(90deg, rgba(255,210,125,.25) 0 8px, transparent 8px 16px);
    transform:translateY(-50%);
  }

  /* ---------- burst sparkles ---------- */
  .sparkle{
    position:fixed;pointer-events:none;z-index:3;border-radius:50%;
    background:radial-gradient(circle, var(--rose), transparent 70%);
    animation:sparkleFloat linear forwards;
  }
  @keyframes sparkleFloat{
    0%{transform:translate(0,0) scale(0);opacity:0;}
    12%{opacity:1;transform:scale(1);}
    100%{transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0;}
  }

  /* ---------- Scene 2: tree + message ---------- */
  #tree-scene{
    display:none;flex-direction:column;align-items:center;
    width:100%;max-width:640px;
  }
  #tree-scene.show{display:flex;animation:fadeUp .7s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

  #tree-wrap{width:min(80vw,260px);height:240px;margin:0 auto;}
  #tree-svg{width:100%;height:100%;overflow:visible;}
  .trunk-path{
    fill:none;stroke:var(--bark);stroke-width:10;stroke-linecap:round;
    stroke-dasharray:260;stroke-dashoffset:260;
    animation:drawTrunk 1.1s ease forwards;
  }
  .branch-path{
    fill:none;stroke:var(--bark);stroke-width:6;stroke-linecap:round;
    stroke-dasharray:120;stroke-dashoffset:120;
    animation:drawTrunk 1s ease forwards;
    animation-delay:.6s;
  }
  @keyframes drawTrunk{to{stroke-dashoffset:0;}}
  .leaf, .flower{
    opacity:0;transform:scale(0);
    animation:popIn .5s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes popIn{to{opacity:1;transform:scale(1);}}

  .grow-hint{
    font-size:13px;color:rgba(253,246,236,.6);margin-top:6px;
    opacity:0;animation:fadeIn .6s ease forwards;animation-delay:1.9s;
  }
  @keyframes fadeIn{to{opacity:1;}}

  #reveal-block{
    opacity:0;transform:translateY(14px);
    animation:fadeUp .8s ease forwards;
    animation-delay:2.3s;
    margin-top:8px;
  }
  .for-line{
    font-family:'Fraunces',serif;font-style:italic;font-weight:500;
    font-size:clamp(15px,3.6vw,18px);color:var(--lilac);margin:0 0 6px;
  }
  .headline{
    font-family:'Fraunces',serif;font-weight:700;
    font-size:clamp(26px,7.2vw,50px);
    margin:0 0 14px;line-height:1.08;
    background:linear-gradient(90deg,var(--gold),var(--rose),var(--lilac),var(--gold));
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmerText 4s linear infinite;
    display:inline-block;
    min-height:1.2em;
  }
  @keyframes shimmerText{
    0%{background-position:0% 50%;}
    100%{background-position:300% 50%;}
  }
  .headline .caret{
    display:inline-block;width:3px;height:0.9em;
    background:var(--gold);margin-left:2px;vertical-align:middle;
    animation:caretBlink .8s steps(1) infinite;
  }
  @keyframes caretBlink{50%{opacity:0;}}
  .card{
    background:rgba(253,246,236,.06);
    border:1px solid rgba(255,210,125,.25);
    backdrop-filter:blur(6px);
    border-radius:20px;
    padding:20px 22px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
    max-width:460px;margin:0 auto;
    cursor:pointer;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .card:active{transform:scale(.98);}
  .card::after{
    content:"tap for more love 💗";
    display:block;font-size:11px;color:rgba(255,210,125,.55);
    margin-top:12px;letter-spacing:.03em;
  }
  #replay-btn{
    margin-top:20px;
    display:inline-flex;align-items:center;gap:6px;
    padding:10px 20px;border-radius:999px;
    border:1px solid rgba(255,210,125,.4);
    background:rgba(253,246,236,.05);
    color:var(--gold);font-family:'Quicksand',sans-serif;font-weight:600;font-size:13px;
    cursor:pointer;
    opacity:0;animation:fadeIn .6s ease forwards;animation-delay:2.9s;
  }
  #replay-btn:active{transform:scale(.95);}
  .message-text{
    font-size:clamp(14.5px,3.6vw,16.5px);
    line-height:1.7;color:var(--cream);margin:0;
  }
  .signature{
    margin-top:14px;font-family:'Fraunces',serif;font-style:italic;
    font-size:14px;color:var(--rose);text-align:right;
  }

  /* ---------- Music control ---------- */
  #music-btn{
    position:fixed;bottom:20px;right:20px;z-index:5;
    width:52px;height:52px;border-radius:50%;
    border:1px solid rgba(255,210,125,.4);
    background:rgba(20,16,45,.7);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--gold);
    box-shadow:0 8px 22px rgba(0,0,0,.4);
    transition:transform .25s ease;
  }
  #music-btn:active{transform:scale(.92);}
  #music-btn.playing{animation:musicPulse 2s ease-in-out infinite;}
  @keyframes musicPulse{
    0%{box-shadow:0 0 0 0 rgba(255,210,125,.35);}
    70%{box-shadow:0 0 0 14px rgba(255,210,125,0);}
    100%{box-shadow:0 0 0 0 rgba(255,210,125,0);}
  }
  #yt-frame{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;bottom:0;right:0;}

  canvas#confetti{position:fixed;inset:0;z-index:4;pointer-events:none;}

  /* ---------- cursor trail (desktop only) ---------- */
  .cursor-spark{
    position:fixed;z-index:6;pointer-events:none;border-radius:50%;
    background:radial-gradient(circle, var(--gold), transparent 70%);
    animation:cursorFade .7s ease forwards;
  }
  @keyframes cursorFade{
    0%{opacity:.8;transform:scale(1);}
    100%{opacity:0;transform:scale(.2) translateY(-14px);}
  }

  /* ---------- flying birds ---------- */
  .bird{
    position:absolute;top:20%;left:-40px;
    font-size:16px;opacity:.8;
    animation:flyAcross linear forwards;
  }
  @keyframes flyAcross{
    0%{transform:translateX(0) translateY(0);}
    50%{transform:translateX(50vw) translateY(-18px);}
    100%{transform:translateX(110vw) translateY(4px);}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important; animation-iteration-count:1 !important;}
  }
</style>
</head>
<body>

<div id="stars"></div>
<svg id="moon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <circle cx="32" cy="32" r="26" fill="#FFF3D6"/>
  <circle cx="24" cy="24" r="4.5" fill="#F3DFA6" opacity="0.6"/>
  <circle cx="38" cy="30" r="3" fill="#F3DFA6" opacity="0.5"/>
  <circle cx="30" cy="42" r="5" fill="#F3DFA6" opacity="0.5"/>
</svg>
<div id="ambient"></div>
<canvas id="confetti"></canvas>

<div id="stage">

  <!-- SCENE 1: shoot the heart -->
  <div id="shoot-scene">
    <div class="eyebrow">for tanu</div>
    <h1 class="prompt-title">One Arrow, One Heart</h1>
    <p class="prompt-sub">Pull back and let it fly.</p>

    <div id="target-area">
      <div class="bow-hint-line"></div>
      <svg id="bow" viewBox="0 0 50 160" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 6 C 44 40, 44 120, 12 154" fill="none" stroke="#8A5A3B" stroke-width="7" stroke-linecap="round"/>
        <path d="M10 4 C 42 38, 42 122, 10 156" fill="none" stroke="#FFD27D" stroke-width="2" stroke-linecap="round"/>
        <line id="bowstring" x1="12" y1="10" x2="12" y2="150" stroke="#FDF6EC" stroke-width="1.6"/>
      </svg>
      <svg id="arrow" viewBox="0 0 70 16" xmlns="http://www.w3.org/2000/svg">
        <line x1="2" y1="8" x2="58" y2="8" stroke="#FFD27D" stroke-width="3" stroke-linecap="round"/>
        <path d="M58 1 L70 8 L58 15 Z" fill="#FFD27D"/>
        <path d="M2 8 L14 2 M2 8 L14 14" stroke="#FF8FAE" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <svg id="heart" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 85 C10 55 0 30 20 14 C34 3 48 10 50 24 C52 10 66 3 80 14 C100 30 90 55 50 85 Z" fill="#FF8FAE"/>
      </svg>
    </div>
    <div class="tap-hint">↑ tap anywhere on the target to shoot ↑</div>
  </div>

  <!-- SCENE 2: tree + message -->
  <div id="tree-scene">
    <div id="tree-wrap">
      <svg id="tree-svg" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="100" cy="208" rx="70" ry="10" fill="#000" opacity="0.18"/>
        <path class="trunk-path" d="M100 200 L100 100" />
        <path class="branch-path" d="M100 140 C 80 120, 60 115, 45 95" />
        <path class="branch-path" d="M100 130 C 120 110, 140 108, 155 90" />
        <path class="branch-path" d="M100 110 C 95 90, 90 75, 95 55" style="animation-delay:.75s"/>
        <g id="foliage"></g>
      </svg>
    </div>

    <div id="reveal-block">
      <p class="for-line">for my favourite shortie,</p>
      <h2 class="headline" id="headline"><span id="headlineText"></span><span class="caret"></span></h2>
      <div class="card" id="loveCard">
        <p class="message-text">
          My little Tanu is growing bigger day by day… in age. The height department
          seems to be permanently closed. 😚😚
        </p>
        <p class="signature">always yours</p>
      </div>
      <button id="replay-btn">↺ watch it again</button>
    </div>
  </div>

</div>

<div id="music-btn" title="Play birthday song">
  <svg id="musicIcon" width="20" height="20" viewBox="0 0 24 24" fill="none">
    <path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.8"/>
    <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.8"/>
  </svg>
</div>
<div id="yt-frame"></div>

<script>
/* ---------------- starfield ---------------- */
(function(){
  const container = document.getElementById('stars');
  for(let i=0;i<70;i++){
    const s = document.createElement('div');
    s.className='star';
    const size = Math.random()*2+1;
    s.style.width = size+'px'; s.style.height = size+'px';
    s.style.left = Math.random()*100+'%'; s.style.top = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*3)+'s';
    s.style.animationDuration = (2+Math.random()*3)+'s';
    container.appendChild(s);
  }
})();

/* ---------------- ambient drifting hearts ---------------- */
const ambient = document.getElementById('ambient');
const driftSymbols = ['💗','✨','🌸'];
function spawnDrift(){
  const el = document.createElement('div');
  el.className = 'drift';
  el.textContent = driftSymbols[Math.floor(Math.random()*driftSymbols.length)];
  const size = 10+Math.random()*14;
  el.style.fontSize = size+'px';
  el.style.left = (Math.random()*100)+'%';
  const dur = 9+Math.random()*8;
  el.style.animationDuration = dur+'s';
  ambient.appendChild(el);
  setTimeout(()=>el.remove(), dur*1000+500);
}
setInterval(spawnDrift, 900);
for(let i=0;i<6;i++) setTimeout(spawnDrift, i*400);


const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

let particles = [];
const colors = ['#FFD27D','#FF8FAE','#C9A7EB','#FDF6EC','#FF9FC0'];

function burstConfetti(n, originX, originY){
  originX = originX ?? canvas.width/2;
  originY = originY ?? canvas.height/2;
  for(let i=0;i<n;i++){
    const angle = Math.random()*Math.PI*2;
    const speed = 2+Math.random()*5;
    particles.push({
      x: originX, y: originY,
      vx: Math.cos(angle)*speed*0.6 + (Math.random()-0.5)*2,
      vy: Math.sin(angle)*speed*0.6 - Math.random()*2,
      size: 4+Math.random()*6,
      color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random()*360,
      vr: (Math.random()-0.5)*12,
      shape: Math.random()>0.5?'rect':'circle',
      life: 0,
      maxLife: 160+Math.random()*90
    });
  }
}

function animateConfetti(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.rot += p.vr; p.life++;
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot*Math.PI/180);
    ctx.globalAlpha = Math.max(0, 1 - p.life/p.maxLife);
    ctx.fillStyle = p.color;
    if(p.shape==='rect'){ ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2); }
    else { ctx.beginPath(); ctx.arc(0,0,p.size/2,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
  });
  particles = particles.filter(p=>p.life < p.maxLife);
  requestAnimationFrame(animateConfetti);
}
animateConfetti();

/* ---------------- sparkle burst (DOM) ---------------- */
function spawnSparkles(n, cx, cy){
  for(let i=0;i<n;i++){
    const el = document.createElement('div');
    el.className='sparkle';
    const size = 4+Math.random()*7;
    const angle = Math.random()*Math.PI*2;
    const dist = 60+Math.random()*160;
    el.style.setProperty('--dx', (Math.cos(angle)*dist)+'px');
    el.style.setProperty('--dy', (Math.sin(angle)*dist)+'px');
    el.style.width = size+'px'; el.style.height = size+'px';
    el.style.left = cx+'px'; el.style.top = cy+'px';
    el.style.animationDuration = (0.9+Math.random()*0.9)+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 2000);
  }
}

/* ---------------- typewriter headline ---------------- */
function typeHeadline(){
  const text = "HAPPY BIRTHDAY TANU!!!!";
  const el = document.getElementById('headlineText');
  let i = 0;
  const interval = setInterval(()=>{
    el.textContent = text.slice(0, i+1);
    i++;
    if(i >= text.length) clearInterval(interval);
  }, 55);
}

/* ---------------- cursor sparkle trail (desktop, hover-capable only) ---------------- */
if(window.matchMedia('(hover:hover) and (pointer:fine)').matches){
  let lastSpark = 0;
  window.addEventListener('mousemove', (e)=>{
    const now = Date.now();
    if(now - lastSpark < 45) return;
    lastSpark = now;
    const el = document.createElement('div');
    el.className = 'cursor-spark';
    const size = 3+Math.random()*4;
    el.style.width = size+'px'; el.style.height = size+'px';
    el.style.left = (e.clientX - size/2)+'px';
    el.style.top = (e.clientY - size/2)+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 700);
  });
}

/* ---------------- flying birds across the tree scene ---------------- */
function flyBirds(){
  const stage = document.getElementById('stage');
  const emojis = ['🕊️','🐦'];
  for(let i=0;i<3;i++){
    setTimeout(()=>{
      const b = document.createElement('div');
      b.className = 'bird';
      b.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      b.style.top = (12+Math.random()*14)+'%';
      const dur = 5+Math.random()*3;
      b.style.animationDuration = dur+'s';
      stage.appendChild(b);
      setTimeout(()=>b.remove(), dur*1000+200);
    }, i*900);
  }
}

/* ---------------- dual-side confetti cannon ---------------- */
function confettiCannons(){
  burstConfetti(60, 0, window.innerHeight);
  burstConfetti(60, window.innerWidth, window.innerHeight);
}


const targetArea = document.getElementById('target-area');
const arrow = document.getElementById('arrow');
const heart = document.getElementById('heart');
const shootScene = document.getElementById('shoot-scene');
const treeScene = document.getElementById('tree-scene');
let fired = false;

targetArea.addEventListener('click', ()=>{
  if(fired) return;
  fired = true;
  targetArea.classList.add('pulling');
  setTimeout(()=>{
    targetArea.classList.remove('pulling');
    arrow.classList.add('fired');
  }, 260);

  setTimeout(()=>{
    const rect = heart.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;

    heart.classList.add('popped');
    arrow.classList.add('done');
    burstConfetti(70, cx, cy);
    spawnSparkles(30, cx, cy);

    setTimeout(()=>{
      shootScene.classList.add('hidden');
      setTimeout(()=>{
        treeScene.classList.add('show');
        growFoliage();
        confettiCannons();
        flyBirds();
        setTimeout(typeHeadline, 2300);
      }, 300);
    }, 650);
  }, 950);
});

/* ---------------- Scene 2: grow the tree foliage ---------------- */
function growFoliage(){
  const g = document.getElementById('foliage');
  const leafPositions = [
    [45,95],[38,80],[55,85],[155,90],[162,75],[145,80],
    [95,55],[80,60],[112,58],[70,75],[130,72],[100,90],
    [60,100],[140,100],[85,45],[115,45]
  ];
  const flowerPositions = [
    [50,90],[150,85],[90,50],[110,52],[70,95],[130,95],[100,65]
  ];

  leafPositions.forEach((pos,i)=>{
    const c = document.createElementNS('http://www.w3.org/2000/svg','ellipse');
    c.setAttribute('cx', pos[0]); c.setAttribute('cy', pos[1]);
    c.setAttribute('rx', 14+Math.random()*8); c.setAttribute('ry', 10+Math.random()*6);
    c.setAttribute('fill', Math.random()>0.5 ? '#7FCF8E' : '#4B9E5F');
    c.setAttribute('transform', `rotate(${Math.random()*60-30} ${pos[0]} ${pos[1]})`);
    c.classList.add('leaf');
    c.style.animationDelay = (1.1 + i*0.05)+'s';
    g.appendChild(c);
  });

  flowerPositions.forEach((pos,i)=>{
    const fg = document.createElementNS('http://www.w3.org/2000/svg','g');
    fg.classList.add('flower');
    fg.style.animationDelay = (1.6 + i*0.07)+'s';
    for(let p=0;p<5;p++){
      const petal = document.createElementNS('http://www.w3.org/2000/svg','circle');
      const ang = (p/5)*Math.PI*2;
      petal.setAttribute('cx', pos[0] + Math.cos(ang)*6);
      petal.setAttribute('cy', pos[1] + Math.sin(ang)*6);
      petal.setAttribute('r', 4.2);
      petal.setAttribute('fill', '#FF9FC0');
      fg.appendChild(petal);
    }
    const center = document.createElementNS('http://www.w3.org/2000/svg','circle');
    center.setAttribute('cx', pos[0]); center.setAttribute('cy', pos[1]);
    center.setAttribute('r', 3.4); center.setAttribute('fill', '#FFD27D');
    fg.appendChild(center);
    g.appendChild(fg);
  });

  setTimeout(()=>{
    const rect = document.getElementById('tree-wrap').getBoundingClientRect();
    burstConfetti(50, rect.left+rect.width/2, rect.top+rect.height*0.35);
    spawnFallingPetals(rect);
  }, 2100);
}

/* ---------------- gentle falling petals from the bloomed tree ---------------- */
function spawnFallingPetals(rect){
  const petalEmojis = ['🌸','🌺','💮'];
  for(let i=0;i<18;i++){
    setTimeout(()=>{
      const el = document.createElement('div');
      el.className = 'petal-fall';
      el.textContent = petalEmojis[Math.floor(Math.random()*petalEmojis.length)];
      el.style.left = (rect.left + Math.random()*rect.width)+'px';
      el.style.fontSize = (12+Math.random()*10)+'px';
      const dur = 3.5+Math.random()*3;
      el.style.animationDuration = dur+'s';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(), dur*1000+300);
    }, i*180);
  }
}

/* ---------------- background music (YouTube) ---------------- */
let ytPlayer, ytReady = false, isPlaying = false;
const musicBtn = document.getElementById('music-btn');
const musicIcon = document.getElementById('musicIcon');

const tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.body.appendChild(tag);

window.onYouTubeIframeAPIReady = function(){
  ytPlayer = new YT.Player('yt-frame', {
    height:'1', width:'1', videoId:'dWhryKAynXE',
    playerVars:{ autoplay:0, controls:0, disablekb:1 },
    events:{ onReady: ()=>{ ytReady = true; } }
  });
};

function setIcon(playing){
  musicIcon.innerHTML = playing
    ? '<rect x="7" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/>'
    : '<path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.8"/>';
}

musicBtn.addEventListener('click', ()=>{
  if(!ytReady) return;
  if(isPlaying){ ytPlayer.pauseVideo(); isPlaying=false; musicBtn.classList.remove('playing'); }
  else { ytPlayer.playVideo(); isPlaying=true; musicBtn.classList.add('playing'); }
  setIcon(isPlaying);
});

/* ---------------- tap the card for an extra heart burst ---------------- */
const loveCard = document.getElementById('loveCard');
loveCard.addEventListener('click', ()=>{
  const rect = loveCard.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  spawnSparkles(20, cx, cy);
  burstConfetti(30, cx, cy);
});

/* ---------------- replay ---------------- */
const replayBtn = document.getElementById('replay-btn');
replayBtn.addEventListener('click', ()=>{
  document.getElementById('foliage').innerHTML = '';
  document.getElementById('headlineText').textContent = '';
  document.querySelectorAll('.bird').forEach(b=>b.remove());
  treeScene.classList.remove('show');
  shootScene.classList.remove('hidden');
  heart.classList.remove('popped');
  arrow.classList.remove('fired','done');
  fired = false;
});
</script>
